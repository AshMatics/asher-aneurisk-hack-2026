[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "slicepoint-core"
dynamic = ["version"]
description = "Importable analysis library for SlicePoint: ingestion, statistics, reference profiles, the check registry and the local assessment runner."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (pending written grant from the student team; see ADR 0001)" }
# ADR 0001 section 9: never FastAPI, a database, a GPU or torch.
dependencies = [
    "slicepoint-schemas>=0.2.0,<0.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=16",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8", "mypy>=1.10", "pandas-stubs>=2.0"]
# Runs slicepoint/notebooks/slicepoint_quickstart.ipynb headlessly in the test suite.
notebook = ["nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29"]

[project.scripts]
slicepoint = "slicepoint_core.cli:entry_point"

[tool.uv.sources]
slicepoint-schemas = { path = "../schemas", editable = true }

[tool.hatch.version]
path = "src/slicepoint_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/slicepoint_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "parity: compares core against the legacy notebook outputs (slow)",
    "notebook: executes the quickstart notebook headlessly (needs the notebook extra)",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.10"
files = ["src", "tests"]

# Targeted ignores: these packages ship no type information.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "scipy", "scipy.*", "pyarrow", "pyarrow.*", "nbclient", "nbclient.*", "nbformat", "nbformat.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
