[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "slicepoint-api"
dynamic = ["version"]
description = "FastAPI service for SlicePoint: job-based assessments over slicepoint-core (ADR 0001 sections 4 and 5)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (pending written grant from the student team; see ADR 0001)" }
dependencies = [
    "slicepoint-schemas>=0.2.1,<0.3",
    "slicepoint-core>=0.2.1,<0.3",
    "fastapi>=0.162.4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "mypy>=1.10", "httpx>=0.27", "pandas-stubs>=2.0"]

[project.scripts]
slicepoint-api = "slicepoint_api.__main__:main"
slicepoint-api-openapi = "slicepoint_api.openapi_export:main"

[tool.uv.sources]
slicepoint-schemas = { workspace = true }
slicepoint-core = { workspace = true }

[tool.hatch.version]
path = "src/slicepoint_api/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/slicepoint_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.10"
files = ["src", "tests"]

# Targeted ignores: these packages ship no type information.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "scipy", "scipy.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
