[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "slicepoint-schemas"
dynamic = ["version"]
description = "Pydantic v2 contract layer for the SlicePoint GO/NO-GO imaging-AI fit assessment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (pending written grant from the student team; see ADR 0001)" }
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "mypy>=1.10", "pyarrow>=16"]

[project.scripts]
slicepoint-schemas-export = "slicepoint_schemas.export:main"

[tool.hatch.version]
path = "src/slicepoint_schemas/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/slicepoint_schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.10"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
