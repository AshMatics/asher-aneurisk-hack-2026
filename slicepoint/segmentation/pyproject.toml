[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slicepoint-model"
version = "0.3.1"
requires-python = ">=3.10,<3.14"
dependencies = [
  "matplotlib>=3.8,<4", "numpy>=1.26,<3", "nibabel>=5.2,<6", "scipy>=1.12,<2",
  "pandas>=2.2,<3", "pyarrow>=16,<24", "azure-storage-blob>=12.20,<13",
  "requests>=2.31,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
model = ["TotalSegmentator==2.11.0", "nnunetv2==2.8.1", "torch==2.13.0", "torchvision==0.28.0"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
slicepoint-model = "slicepoint_model.cli:main"

[tool.setuptools.packages.find]
include = ["slicepoint_model*"]
