# uv workspace for the SlicePoint Python packages (development and CI).
# Members: schemas (contract), core (analysis library), api (FastAPI service, M4).
#
#   uv sync --all-packages --all-extras    # one .venv here with schemas + core + api and their test extras
#   uv run --directory core pytest         # or: cd core && uv run pytest / uv run mypy
#
# One uv.lock pins every dependency for both packages. Hospitals do not need uv: the
# packages are ordinary pyproject builds, so `pip install -e schemas -e core` still works
# (docs/getting-started-hospital.md).
#
# segmentation/ (slicepoint-model) is left out on purpose: it is the separate GPU worker
# (ADR 0001 section 4) with torch/TotalSegmentator pins and its own Python range, and it
# should not constrain the analysis packages' lock.
[tool.uv.workspace]
members = ["schemas", "core", "api"]
exclude = ["segmentation"]

# Lint (CI runs `ruff check .` from slicepoint/). A small, high-signal rule set: syntax
# errors, undefined names, unused imports and statement-level mistakes.
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "core/tests/notebook_reference.py",   # a line-by-line transcription of the POC notebook, kept for parity
    "python_notebooks",                   # the student team's original POC notebooks and scripts, kept as written
    "**/node_modules/**",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"segmentation/tests/*" = ["E702"]   # the student team's compact test style
